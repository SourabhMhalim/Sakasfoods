name: Deploy to GoDaddy - Sakas Foods

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Deploy to GoDaddy via SFTP
        uses: wangyucode/sftp-deploy-action@v2.0.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          port: 22
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local_path: ./
          remote_path: ./public_html/
          exclude: |
            .git/
            .github/
            README.md
            .gitignore
            *.md