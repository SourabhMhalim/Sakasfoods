name: Deploy to GoDaddy - Sakas Foods

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Deploy to GoDaddy via SFTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          ftp-server: sftp://${{ secrets.FTP_SERVER }}:22
          ftp-username: ${{ secrets.FTP_USERNAME }}
          ftp-password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: ./public_html/
          exclude: |
            .git/
            .github/
            README.md
            .gitignore
            *.md
          log-level: verbose